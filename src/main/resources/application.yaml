spring:
  application:
    name: Yachani

  datasource:
    url: jdbc:postgresql://localhost:5432/yachanidb
    username: postgres
    password: adminadmin

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true      

server:
  servlet:
    context-path: /api

yachani:
  recordatorio:
    minutos-antes: 60
