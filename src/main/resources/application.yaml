spring:
  application:
    name: Yachani

  datasource:
    url: jdbc:postgresql://localhost:5432/yachanidb
    username: postgres
    password: adminadmin

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  servlet:
    context-path: /api
