spring:
  application:
    name: Yachani

  datasource:
    url: jdbc:postgresql://localhost:5432/yachanidb
    username: postgres
    password: adminadmin

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 51MB


cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

recursos:
  max-archivos: 5
  max-bytes-archivo: 10485760
  max-temas: 30
  segundos-descarga: 120
  extensiones: pdf,docx,pptx,xlsx,png,jpg,jpeg

server:
  servlet:
    context-path: /api

yachani:
  recordatorio:
    minutos-antes: 60